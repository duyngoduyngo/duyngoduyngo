<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Duy Ngo — Analytics Lineage</title>
<style>
  :root{
    --bg:#1f1f1f; --panel:#252526; --line:#3c3c3c; --grid:#333;
    --text:#e0e0e0; --muted:#8a8a8a; --link:#4daafc;
    --edge:#e8a33d; --blue:#8ab4f8; --green:#6ec48a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
  header{height:38px;background:var(--panel);display:flex;align-items:center;
    gap:22px;padding:0 18px;font-size:12px;border-bottom:1px solid #1a1a1a}
  header .tab{color:var(--muted)}
  header .tab.active{color:var(--text);font-weight:700;
    box-shadow:inset 0 -2px 0 var(--link);padding-bottom:9px}
  header .spacer{flex:1}
  header button{background:#0e639c;color:#fff;border:0;border-radius:4px;
    padding:5px 12px;font:inherit;font-size:11px;cursor:pointer}
  header button:hover{background:#1177bb}
  #canvas{position:relative;height:calc(100% - 38px);overflow:hidden;
    background-image:radial-gradient(var(--grid) 1px,transparent 1px);
    background-size:16px 16px;touch-action:none}
  svg#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .node{position:absolute;width:210px;background:var(--panel);
    border:1.4px solid var(--line);border-radius:7px;padding:10px;
    display:flex;gap:10px;cursor:grab;user-select:none}
  .node:active{cursor:grabbing}
  .node.selected{border-color:var(--edge);border-width:2px}
  .node.exposure{border-style:dashed;border-color:#3f6b4a;width:210px}
  .chip{width:36px;height:36px;flex:none;border-radius:6px;background:#333;
    border:1px solid var(--line);display:grid;place-items:center;
    font-size:9px;font-weight:700;color:#b8b8b8}
  .chip.mdl{background:#2d3b4d;border-color:#3d5673;color:var(--blue)}
  .chip.mart{background:#4a3a1e;border-color:#7a5f2e;color:var(--edge)}
  .chip.exp{background:#26382c;border-color:#3f6b4a;color:var(--green)}
  .body{min-width:0}
  .name{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .desc,.meta{font-size:8.5px;color:var(--muted);margin-top:3px}
  .meta{color:#6b6b6b}
  .hint{position:absolute;left:18px;bottom:14px;font-size:10px;color:#6b6b6b}
</style>
</head>
<body>

<header>
  <span class="tab">Query Results</span>
  <span class="tab active">Lineage</span>
  <span class="spacer"></span>
  <button id="reset">Reset</button>
</header>

<div id="canvas">
  <svg id="edges">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#e8a33d"/>
      </marker>
    </defs>
  </svg>
  <div class="hint">Drag any node to rearrange the graph.</div>
</div>

<script>
const NODES = [
  {id:'sap',   x: 40, y: 70,  chip:'SRC', cls:'',        name:'sap_fiori',           desc:'procurement · QT0304',  meta:''},
  {id:'core',  x: 40, y: 250, chip:'SRC', cls:'',        name:'core_banking',        desc:'oracle · vendors',      meta:''},
  {id:'stg',   x:320, y:160,  chip:'MDL', cls:'mdl',     name:'stg_procurement',     desc:'clean · rename · cast', meta:'view'},
  {id:'int',   x:600, y:160,  chip:'MDL', cls:'mdl',     name:'int_vendor_spend',    desc:'join · business logic', meta:'ephemeral'},
  {id:'mart',  x:880, y:160,  chip:'MDL', cls:'mart',    name:'mart_vendor_kpi',     desc:'star schema · tested',  meta:'table · 6 tests', selected:true},
  {id:'bi',    x:880, y:300,  chip:'EXP', cls:'exp',     name:'power_bi_dashboard',  desc:'leadership reporting',  meta:'', exposure:true}
];
const EDGES = [['sap','stg'],['core','stg'],['stg','int'],['int','mart'],['mart','bi']];

const canvas = document.getElementById('canvas');
const svg    = document.getElementById('edges');
const els    = {};
const home   = {};

NODES.forEach(n => {
  const d = document.createElement('div');
  d.className = 'node ' + (n.exposure ? 'exposure ' : '') + (n.selected ? 'selected' : '');
  d.style.left = n.x + 'px';
  d.style.top  = n.y + 'px';
  d.innerHTML =
    '<div class="chip ' + n.cls + '">' + n.chip + '</div>' +
    '<div class="body"><div class="name">' + n.name + '</div>' +
    '<div class="desc">' + n.desc + '</div>' +
    (n.meta ? '<div class="meta">' + n.meta + '</div>' : '') + '</div>';
  canvas.appendChild(d);
  els[n.id] = d;
  home[n.id] = {x:n.x, y:n.y};
  makeDraggable(d);
});

function centreRight(el){ return {x: el.offsetLeft + el.offsetWidth, y: el.offsetTop + el.offsetHeight/2}; }
function centreLeft(el){  return {x: el.offsetLeft,                  y: el.offsetTop + el.offsetHeight/2}; }

function drawEdges(){
  [...svg.querySelectorAll('path.edge')].forEach(p => p.remove());
  EDGES.forEach(([a,b]) => {
    const s = centreRight(els[a]), t = centreLeft(els[b]);
    const dx = Math.max(30, Math.abs(t.x - s.x) * 0.45);
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','edge');
    p.setAttribute('d', `M${s.x} ${s.y} C${s.x+dx} ${s.y}, ${t.x-dx} ${t.y}, ${t.x} ${t.y}`);
    p.setAttribute('fill','none');
    p.setAttribute('stroke', b === 'bi' ? '#3f6b4a' : '#e8a33d');
    p.setAttribute('stroke-width','1.8');
    if (b === 'bi') p.setAttribute('stroke-dasharray','5 4');
    else p.setAttribute('marker-end','url(#arrow)');
    svg.appendChild(p);
  });
}

function makeDraggable(el){
  let ox = 0, oy = 0, dragging = false;
  el.addEventListener('pointerdown', e => {
    dragging = true;
    el.setPointerCapture(e.pointerId);
    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;
    el.style.zIndex = 10;
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const maxX = canvas.clientWidth  - el.offsetWidth;
    const maxY = canvas.clientHeight - el.offsetHeight;
    el.style.left = Math.min(Math.max(0, e.clientX - ox), maxX) + 'px';
    el.style.top  = Math.min(Math.max(0, e.clientY - oy), maxY) + 'px';
    drawEdges();
  });
  el.addEventListener('pointerup', e => {
    dragging = false;
    el.style.zIndex = 1;
    el.releasePointerCapture(e.pointerId);
  });
}

document.getElementById('reset').addEventListener('click', () => {
  NODES.forEach(n => {
    els[n.id].style.left = home[n.id].x + 'px';
    els[n.id].style.top  = home[n.id].y + 'px';
  });
  drawEdges();
});

window.addEventListener('resize', drawEdges);
drawEdges();
</script>
</body>
</html>
