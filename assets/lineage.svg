<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="dbt lineage graph: SAP Fiori and Oracle sources into staging, intermediate and mart models, exposed in Power BI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#333333"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8a33d"/>
    </marker>
  </defs>

  <rect width="1000" height="380" rx="8" fill="#1f1f1f"/>
  <rect y="36" width="1000" height="344" fill="url(#grid)"/>

  <!-- ══ panel header ══ -->
  <rect width="1000" height="36" rx="8" fill="#252526"/>
  <rect y="28" width="1000" height="8" fill="#252526"/>
  <text x="20" y="23" fill="#9e9e9e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Query Results</text>
  <text x="110" y="23" fill="#e0e0e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Lineage</text>
  <rect x="104" y="32" width="58" height="2" fill="#4daafc"/>
  <text x="850" y="23" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">duy_ngo · analytics</text>

  <!-- ══ edges ══ -->
  <g fill="none" stroke="#e8a33d" stroke-width="1.8" marker-end="url(#arrow)">
    <path id="e1" d="M214 104 C244 104, 240 176, 262 176"/>
    <path id="e2" d="M214 249 C244 249, 240 176, 262 176"/>
    <path id="e3" d="M458 176 C482 176, 486 176, 506 176"/>
    <path id="e4" d="M702 176 C726 176, 730 176, 750 176"/>
  </g>

  <g fill="#ffd28a">
    <circle r="3">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M214 104 C244 104, 240 176, 262 176"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3">
      <animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M214 249 C244 249, 240 176, 262 176"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3">
      <animateMotion dur="1.4s" begin="1.3s" repeatCount="indefinite" path="M458 176 C482 176, 486 176, 506 176"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.4s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3">
      <animateMotion dur="1.4s" begin="2.0s" repeatCount="indefinite" path="M702 176 C726 176, 730 176, 750 176"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.4s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ══ nodes ══ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

    <!-- source: sap -->
    <g>
      <rect x="24" y="70" width="190" height="68" rx="7" fill="#252526" stroke="#4a4a4a" stroke-width="1.4"/>
      <rect x="34" y="86" width="36" height="36" rx="6" fill="#333333" stroke="#4a4a4a"/>
      <text x="52" y="109" fill="#b8b8b8" font-size="9" font-weight="700" text-anchor="middle">SRC</text>
      <text x="80" y="99" fill="#e0e0e0" font-size="11.5">sap_fiori</text>
      <text x="80" y="113" fill="#8a8a8a" font-size="8.5">procurement · QT0304</text>
      <text x="204" y="131" fill="#4daafc" font-size="8" text-anchor="end">Details</text>
    </g>

    <!-- source: oracle -->
    <g>
      <rect x="24" y="215" width="190" height="68" rx="7" fill="#252526" stroke="#4a4a4a" stroke-width="1.4"/>
      <rect x="34" y="231" width="36" height="36" rx="6" fill="#333333" stroke="#4a4a4a"/>
      <text x="52" y="254" fill="#b8b8b8" font-size="9" font-weight="700" text-anchor="middle">SRC</text>
      <text x="80" y="244" fill="#e0e0e0" font-size="11.5">core_banking</text>
      <text x="80" y="258" fill="#8a8a8a" font-size="8.5">oracle · vendors</text>
      <text x="204" y="276" fill="#4daafc" font-size="8" text-anchor="end">Details</text>
    </g>

    <!-- staging -->
    <g>
      <rect x="268" y="142" width="190" height="68" rx="7" fill="#252526" stroke="#4a4a4a" stroke-width="1.4"/>
      <rect x="278" y="158" width="36" height="36" rx="6" fill="#2d3b4d" stroke="#3d5673"/>
      <text x="296" y="181" fill="#8ab4f8" font-size="9" font-weight="700" text-anchor="middle">MDL</text>
      <text x="324" y="171" fill="#e0e0e0" font-size="11.5">stg_procurement</text>
      <text x="324" y="185" fill="#8a8a8a" font-size="8.5">clean · rename · cast</text>
      <text x="324" y="200" fill="#6b6b6b" font-size="8">view</text>
      <text x="448" y="203" fill="#4daafc" font-size="8" text-anchor="end">Details</text>
    </g>

    <!-- intermediate -->
    <g>
      <rect x="512" y="142" width="190" height="68" rx="7" fill="#252526" stroke="#4a4a4a" stroke-width="1.4"/>
      <rect x="522" y="158" width="36" height="36" rx="6" fill="#2d3b4d" stroke="#3d5673"/>
      <text x="540" y="181" fill="#8ab4f8" font-size="9" font-weight="700" text-anchor="middle">MDL</text>
      <text x="568" y="171" fill="#e0e0e0" font-size="11.5">int_vendor_spend</text>
      <text x="568" y="185" fill="#8a8a8a" font-size="8.5">join · business logic</text>
      <text x="568" y="200" fill="#6b6b6b" font-size="8">ephemeral</text>
      <text x="692" y="203" fill="#4daafc" font-size="8" text-anchor="end">Details</text>
    </g>

    <!-- mart (selected) -->
    <g>
      <rect x="756" y="142" width="190" height="68" rx="7" fill="#252526" stroke="#e8a33d" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="766" y="158" width="36" height="36" rx="6" fill="#4a3a1e" stroke="#7a5f2e"/>
      <text x="784" y="181" fill="#e8a33d" font-size="9" font-weight="700" text-anchor="middle">MDL</text>
      <text x="812" y="171" fill="#e0e0e0" font-size="11.5">mart_vendor_kpi</text>
      <text x="812" y="185" fill="#8a8a8a" font-size="8.5">star schema · tested</text>
      <text x="812" y="200" fill="#6b6b6b" font-size="8">table · 6 tests</text>
      <text x="936" y="203" fill="#4daafc" font-size="8" text-anchor="end">Details</text>
    </g>

    <!-- exposure -->
    <g opacity="0.95">
      <rect x="756" y="262" width="190" height="52" rx="7" fill="#252526" stroke="#3f6b4a" stroke-width="1.4" stroke-dasharray="5 4"/>
      <rect x="766" y="274" width="30" height="28" rx="5" fill="#26382c" stroke="#3f6b4a"/>
      <text x="781" y="292" fill="#6ec48a" font-size="8" font-weight="700" text-anchor="middle">EXP</text>
      <text x="806" y="286" fill="#cfcfcf" font-size="10.5">power_bi_dashboard</text>
      <text x="806" y="299" fill="#8a8a8a" font-size="8">leadership reporting</text>
    </g>
    <path d="M851 210 L851 262" fill="none" stroke="#3f6b4a" stroke-width="1.4" stroke-dasharray="4 4"/>

  </g>

  <text x="24" y="358" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
    sources → staging → intermediate → marts → exposures · the layer I am moving into
  </text>
</svg>
