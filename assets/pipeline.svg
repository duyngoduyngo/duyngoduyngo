<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Analytics pipeline lineage: Source to Store to Transform to Model to BI, with Git, Orchestration and Data Quality feeding in" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect width="900" height="350" rx="14" fill="#0b0f19"/>
  <rect x="0.5" y="0.5" width="899" height="349" rx="14" fill="none" stroke="#1f2937"/>

  <text x="26" y="34" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">analytics_pipeline.lineage</text>
  <text x="26" y="53" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">solid = used in real work   ·   dashed = building fluency</text>

  <!-- ══ flow rail (drawn behind the nodes so particles pass through them) ══ -->
  <path d="M20 152 H830" stroke="#1e293b" stroke-width="2" fill="none"/>

  <circle r="4.5" fill="#38bdf8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M20 152 H830"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.96;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#a78bfa">
    <animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M20 152 H830"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.96;1" dur="5s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#34d399">
    <animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M20 152 H830"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.96;1" dur="5s" begin="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ══ dashed support edges (marching ants) ══ -->
  <path d="M135 246 C135 210, 425 212, 425 186" fill="none" stroke="#14b8a6" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path d="M385 246 C385 218, 420 212, 425 186" fill="none" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path d="M628 246 C628 218, 600 212, 595 186" fill="none" stroke="#ec4899" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <!-- ══ main nodes ══ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

    <g>
      <rect x="20" y="120" width="130" height="64" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="85" y="143" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Source</text>
      <text x="85" y="159" fill="#94a3b8" font-size="8.5" text-anchor="middle">SAP Fiori · Oracle</text>
      <text x="85" y="172" fill="#94a3b8" font-size="8.5" text-anchor="middle">Excel · CSV</text>
    </g>
    <text x="170" y="157" fill="#334155" font-size="14" text-anchor="middle">›</text>

    <g>
      <rect x="190" y="120" width="130" height="64" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
      <text x="255" y="143" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Store</text>
      <text x="255" y="159" fill="#94a3b8" font-size="8.5" text-anchor="middle">Snowflake · Databricks</text>
      <text x="255" y="172" fill="#94a3b8" font-size="8.5" text-anchor="middle">Fabric · Postgres</text>
    </g>
    <text x="340" y="157" fill="#334155" font-size="14" text-anchor="middle">›</text>

    <g>
      <rect x="360" y="120" width="130" height="64" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="2.4">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="425" y="143" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Transform</text>
      <text x="425" y="159" fill="#94a3b8" font-size="8.5" text-anchor="middle">SQL · pandas</text>
      <text x="425" y="172" fill="#94a3b8" font-size="8.5" text-anchor="middle">Power Query · dbt</text>
    </g>
    <text x="510" y="157" fill="#334155" font-size="14" text-anchor="middle">›</text>

    <g>
      <rect x="530" y="120" width="130" height="64" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <text x="595" y="143" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Model</text>
      <text x="595" y="159" fill="#94a3b8" font-size="8.5" text-anchor="middle">Star schema</text>
      <text x="595" y="172" fill="#94a3b8" font-size="8.5" text-anchor="middle">staging → marts</text>
    </g>
    <text x="680" y="157" fill="#334155" font-size="14" text-anchor="middle">›</text>

    <g>
      <rect x="700" y="120" width="130" height="64" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="765" y="143" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">BI &amp; Analytics</text>
      <text x="765" y="159" fill="#94a3b8" font-size="8.5" text-anchor="middle">Power BI · Superset</text>
      <text x="765" y="172" fill="#94a3b8" font-size="8.5" text-anchor="middle">Tableau · plotly</text>
    </g>

    <!-- ══ support nodes ══ -->
    <g opacity="0.9">
      <rect x="60" y="246" width="150" height="54" rx="10" fill="#0f172a" stroke="#14b8a6" stroke-width="1.6" stroke-dasharray="6 4"/>
      <text x="135" y="268" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">Git &amp; CI/CD</text>
      <text x="135" y="285" fill="#64748b" font-size="8.5" text-anchor="middle">Git · GitHub Actions</text>
    </g>

    <g opacity="0.9">
      <rect x="310" y="246" width="150" height="54" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="6 4"/>
      <text x="385" y="268" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">Orchestrate</text>
      <text x="385" y="285" fill="#64748b" font-size="8.5" text-anchor="middle">Airflow</text>
    </g>

    <g opacity="0.9">
      <rect x="553" y="246" width="150" height="54" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.6" stroke-dasharray="6 4"/>
      <text x="628" y="268" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">Data Quality</text>
      <text x="628" y="285" fill="#64748b" font-size="8.5" text-anchor="middle">dbt tests · dbt docs</text>
    </g>

  </g>
</svg>
